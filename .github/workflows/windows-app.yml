name: Windows app

# Builds the portable Windows exe on every push so there is always a tested build to download
# from the run's Artifacts.
#
# To publish a release, either:
#   - open this workflow on the Actions tab, choose "Run workflow" and enter a version, or
#   - push a tag like v1.2.0.
# Both build, test and then publish the exe as a GitHub release with that version.

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish as a release, for example 1.2.0. Leave empty for a test build only.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install build tools
        run: npm ci

      # A release takes its version from the "Run workflow" box or from the tag.
      # Ordinary pushes have neither, and only produce a test build.
      - name: Work out the release version
        id: release
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$REQUESTED" ]]; then version="${REQUESTED#v}"; fi
          if [[ -n "$version" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a version number like 1.2.0"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version:-none, this is a test build}"

      - name: Set the app version
        if: steps.release.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build the portable exe
        run: npm run dist

      - name: Test the app
        run: node scripts/smoke-test.js "dist/win-unpacked/Intune RBAC Designer.exe"

      - name: Check the portable exe starts
        shell: pwsh
        run: |
          $exe = Get-Item dist/Intune-RBAC-Designer-*-win-x64.exe
          Write-Host ("Starting {0} ({1:n0} MB)" -f $exe.Name, ($exe.Length / 1MB))
          $started = Get-Date
          Start-Process -FilePath $exe.FullName
          $window = $null
          while (-not $window -and ((Get-Date) - $started).TotalSeconds -lt 180) {
            Start-Sleep -Seconds 2
            $window = Get-Process -Name 'Intune RBAC Designer' -ErrorAction SilentlyContinue |
              Where-Object { $_.MainWindowTitle -eq 'Intune RBAC Designer' } | Select-Object -First 1
          }
          if (-not $window) {
            Get-Process | Where-Object MainWindowTitle | Format-Table Name, MainWindowTitle
            throw 'The portable exe did not open its window within 3 minutes'
          }
          Write-Host ("Window open after {0:n0} seconds" -f ((Get-Date) - $started).TotalSeconds)
          Get-Process -Name 'Intune RBAC Designer', 'Intune-RBAC-Designer-*' -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Write checksum
        shell: pwsh
        run: |
          $exe = Get-Item dist/Intune-RBAC-Designer-*-win-x64.exe
          "$((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower())  $($exe.Name)" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v6
        with:
          name: Intune-RBAC-Designer-win-x64
          path: |
            dist/Intune-RBAC-Designer-*-win-x64.exe
            dist/SHA256SUMS.txt
            dist/smoke-test.png
          if-no-files-found: error

  # Runs no code from the repository: it only takes the tested build from the job above.
  # For a test build it stops after fetching it; for a release it publishes it.
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: Intune-RBAC-Designer-win-x64
          path: release

      - name: Show what would be published
        run: ls -l release && cat release/SHA256SUMS.txt

      - name: Publish GitHub release
        if: needs.build.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v${VERSION}"
          cat > notes.md <<EOF
          ## How to use it

          1. Download **Intune-RBAC-Designer-${VERSION}-win-x64.exe** below.
          2. Double-click it. There is nothing to install and no admin rights are needed.

          Starting takes 10-15 seconds, because the app unpacks itself each time. A small "Starting" window shows while it does.

          Windows may show a blue "Windows protected your PC" prompt because the app is not code signed.
          Choose **More info**, then **Run anyway**.

          Your roles are saved on your PC and are still there the next time you open the app.
          Exports are saved to your Downloads folder.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A release for this tag already exists (for example one drafted on github.com):
            # add the tested files to it rather than failing.
            gh release upload "$tag" release/*.exe release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Creates the tag at this commit if it does not exist yet
            gh release create "$tag" release/*.exe release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Intune RBAC Designer ${VERSION}" \
              --notes-file notes.md \
              --generate-notes
          fi

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Intune RBAC Designer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Top bar (small screens only) ── -->
  <div class="mobile-bar">
    <button class="icon-btn" id="btn-open-sidebar" title="Show roles" aria-label="Show roles">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <span class="brand-name">Intune RBAC Designer</span>
  </div>

  <!-- ── App Body ── -->
  <div class="app-body">

    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="sidebar" aria-label="Roles">
      <div class="sidebar-resize-handle" id="sidebar-resize-handle" title="Drag to resize · double-click to reset"></div>

      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1 class="brand-name">Intune RBAC Designer</h1>
        <button class="icon-btn" id="btn-dark-mode" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg id="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg id="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-actions">
        <button class="btn btn-primary" id="btn-new-role">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Role
        </button>
        <button class="btn btn-primary btn-split" id="btn-new-role-menu" title="More ways to start a role" aria-label="More ways to start a role" aria-haspopup="menu">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <button class="icon-btn icon-btn-bordered" id="btn-new-group" title="New folder" aria-label="New folder">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
            <line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-section-label">
        <h2>Roles</h2>
        <span class="sidebar-role-total" id="sidebar-role-total"></span>
      </div>

      <div class="roles-list" id="roles-list"></div>

      <div class="sidebar-footer">
        <div class="sidebar-footer-label">Review</div>
        <button class="btn btn-ghost btn-full" id="btn-compare">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></svg>
          Compare Roles
        </button>
        <button class="btn btn-ghost btn-full" id="btn-find">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="20.5" y1="20.5" x2="16.2" y2="16.2"/></svg>
          Who Has a Permission?
        </button>
        <div class="sidebar-footer-label">Export and backup</div>
        <button class="btn btn-ghost btn-full" id="btn-export-excel">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
          Export Excel
        </button>
        <button class="btn btn-ghost btn-full" id="btn-export-image">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="9" x2="15" y2="21"/></svg>
          Compare Image
        </button>
        <button class="btn btn-ghost btn-full" id="btn-data">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Backup and Import
        </button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- ── Main Panel ── -->
    <main class="main-panel" id="main-panel"></main>

  </div>

  <!-- ── Dialog (summary, compare, checks, backup, …) ── -->
  <div class="modal-overlay" id="dialog">
    <div class="modal" id="dialog-box" role="dialog" aria-labelledby="dialog-title" aria-modal="true">
      <div class="modal-header">
        <div class="modal-heading">
          <p class="modal-eyebrow" id="dialog-eyebrow"></p>
          <h2 id="dialog-title"></h2>
        </div>
        <button class="icon-btn modal-close" id="dialog-close" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="dialog-body"></div>
      <div class="modal-footer" id="dialog-footer"></div>
    </div>
  </div>

  <!-- ── Destructive Permission Modal ── -->
  <div class="modal-overlay modal-overlay-top" id="destructive-modal">
    <div class="modal modal-warning" role="dialog" aria-labelledby="destructive-title" aria-modal="true">
      <div class="modal-header">
        <div class="modal-warning-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <div class="modal-heading">
          <h2 id="destructive-title">High-impact permission</h2>
        </div>
      </div>
      <div class="modal-body">
        <p class="destructive-lead">You're about to grant a permission that can cause <strong>data loss</strong>, remove devices from management, or open a device to <strong>unattended access</strong>:</p>
        <ul id="destructive-list" class="destructive-list"></ul>
        <p class="destructive-tail">Make sure this role really needs it before continuing.</p>
        <label class="modal-checkbox">
          <input type="checkbox" id="destructive-dont-show" />
          <span>Don't show this warning again in this window</span>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="destructive-cancel">Cancel</button>
        <button class="btn btn-warning" id="destructive-confirm">Add anyway</button>
      </div>
    </div>
  </div>

  <!-- ── Tooltip ── -->
  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <!-- ── Toast ── -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ── Off-screen comparison render target ── -->
  <div id="comparison-render"></div>

  <!-- ── Scripts ── -->
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="permissions.js"></script>
  <script src="built-in-roles.js"></script>
  <script src="export-excel.js"></script>
  <script src="export-image.js"></script>
  <script src="app.js"></script>
  <script src="assignments.js"></script>
  <script src="checks.js"></script>
  <script src="review.js"></script>
  <script src="data.js"></script>
</body>
</html>

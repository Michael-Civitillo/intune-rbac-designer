<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intune RBAC Designer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 2L2 7l10 5 10-5-10-5z" stroke-linejoin="round"/>
        <path d="M2 17l10 5 10-5" stroke-linejoin="round"/>
        <path d="M2 12l10 5 10-5" stroke-linejoin="round"/>
      </svg>
      <h1>Intune RBAC Designer</h1>
    </div>
    <div class="header-actions">
      <button class="btn-icon-header" id="btn-dark-mode" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <button class="btn btn-primary btn-sm" id="btn-new-role">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Role
      </button>
    </div>
  </header>

  <!-- ── App Body ── -->
  <div class="app-body">

    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-resize-handle" id="sidebar-resize-handle" title="Drag to resize sidebar"></div>
      <div class="sidebar-header">
        <h2>Roles</h2>
        <button class="sidebar-icon-btn" id="btn-new-group" title="New folder">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
            <line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
        </button>
      </div>
      <div class="roles-list" id="roles-list"></div>
      <div class="sidebar-footer">
        <button class="btn btn-outline-primary btn-sm btn-full" id="btn-new-role-sidebar">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Role
        </button>
        <button class="btn btn-secondary btn-sm btn-full" id="btn-export-excel">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Export Excel
        </button>
        <button class="btn btn-secondary btn-sm btn-full" id="btn-export-image">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Compare Image
        </button>
      </div>
    </aside>

    <!-- ── Main Panel ── -->
    <main class="main-panel" id="main-panel">
      <div class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
        <h3>No Role Selected</h3>
        <p>Create a new role to get started.</p>
      </div>
    </main>

  </div>

  <!-- ── Summary Modal ── -->
  <div class="modal-overlay" id="summary-modal">
    <div class="modal" role="dialog" aria-labelledby="summary-title" aria-modal="true">
      <div class="modal-header">
        <h2 id="summary-title">Role Summary</h2>
        <button class="modal-close" id="summary-modal-close" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="summary-body"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="summary-modal-close-btn">Close</button>
      </div>
    </div>
  </div>

  <!-- ── Tooltip ── -->
  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <!-- ── Toast ── -->
  <div class="toast" id="toast"></div>

  <!-- ── Off-screen comparison render target ── -->
  <div id="comparison-render"></div>

  <!-- ── Scripts ── -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="permissions.js"></script>
  <script src="export-excel.js"></script>
  <script src="export-image.js"></script>
  <script src="app.js"></script>
</body>
</html>
